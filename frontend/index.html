<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentación técnica</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2124" media="(prefers-color-scheme: dark)" />
    <script>
      // Resolve the theme before the first paint so night mode never flashes light.
      (function(){try{var s=localStorage.getItem('techdocs.theme');document.documentElement.dataset.theme=(s==='dark'||s==='light')?s:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){document.documentElement.dataset.theme='light';}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
