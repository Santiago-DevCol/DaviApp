# Serves the Vite bundle and proxies /api/* to the backend service.

# Docker's embedded DNS. Resolving `backend` through a variable (instead of a
# static upstream) lets nginx start before the backend and follow IP changes
# when the backend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ---- API (prefix stripped: /api/search -> /search) ----
  location /api/ {
    set $backend http://backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events (/api/events): no buffering, no cache, long reads.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Multipart uploads: up to 20 files x 10 MB per request.
    client_max_body_size 256m;
  }

  # ---- Hashed build assets: cache forever ----
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- SPA fallback ----
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
