# Local infrastructure for development.
# The `backend` and `frontend` services are added in a later phase.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: techdocs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d techdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
